[project]
name = "nonclinical-safety-agent"
version = "0.2.0"
description = "Bundled Magenta investigator for the AI-Ready Nonclinical Safety solution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-openai>=1.1.12",
    "magenta-sdk-core",
    "magenta-sdklanggraph",
    "pymongo>=4.11.0",
    "python-dotenv>=1.0.0",
    "runner-shared[mongodb]",
    "uvicorn>=0.34.0",
]

[project.scripts]
safety-agent = "safety_agent.gateway:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_agent"]

[tool.uv]
find-links = ["vendor"]

[tool.uv.sources]
magenta-sdklanggraph = { path = "vendor/magenta_sdklanggraph-0.1.0-py3-none-any.whl" }
magenta-sdk-core = { path = "vendor/magenta_sdk_core-0.1.0-py3-none-any.whl" }
runner-shared = { path = "vendor/runner_shared-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
