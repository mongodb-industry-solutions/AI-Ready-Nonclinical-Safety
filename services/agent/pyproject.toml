[project]
name = "nonclinical-safety-agent"
version = "0.2.0"
description = "Bundled Magenta investigator for the AI-Ready Nonclinical Safety solution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-openai>=1.1.12",
    "magenta-sdk-core",
    "magenta-sdklanggraph",
    "pymongo>=4.11.0",
    "python-dotenv>=1.0.0",
    "runner-shared",
    "uvicorn>=0.34.0",
]

[project.scripts]
safety-agent = "safety_agent.gateway:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_agent"]

[tool.uv.sources]
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/magenta-sdklanggraph" }
magenta-sdk-core = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/sdk-core" }
runner-shared = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/runner-shared" }

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
